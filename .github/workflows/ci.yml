name: CI

# Mirrors the local gate exactly, so green-local means green-CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `version:` here on purpose. pnpm/action-setup errors outright when
      # it is given one AND package.json declares `packageManager`, and the
      # manifest is the right single source: it is what corepack, local
      # installs and the dependency-freshness gate all read.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile so a stale lock fails here rather than silently
      # resolving something the local gate never saw.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Shellcheck
        run: shellcheck install.sh run.sh

      - name: Tests + 100% coverage
        run: pnpm run coverage

      - name: Build
        run: pnpm run build
