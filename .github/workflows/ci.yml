name: CI

# Mirrors the local gate exactly, so green-local means green-CI.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Shellcheck
        run: shellcheck install.sh run.sh

      - name: Tests + 100% coverage
        run: npm run coverage

      - name: Build
        run: npm run build
